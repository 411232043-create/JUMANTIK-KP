<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#065F46">
    <title>Offline · Jumantik Online</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f5;color:#19342a;font:16px Arial,sans-serif}.card{max-width:420px;padding:32px;border:1px solid #fff;border-radius:24px;background:#ffffffdf;box-shadow:0 18px 48px #1e46340f;text-align:center}.icon{margin:auto;display:grid;width:64px;height:64px;place-items:center;border-radius:20px;background:linear-gradient(135deg,#10b981,#047857);color:#fff;font-size:30px}.card h1{font-size:22px}.card p{color:#708078;line-height:1.6}.card button{margin-top:12px;padding:12px 18px;border:0;border-radius:12px;background:#087653;color:white;font-weight:bold}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">⌁</div>
      <h1>Koneksi sedang terputus</h1>
      <p>Laporan inspeksi yang sudah dibuat tetap tersimpan di perangkat. Sambungkan internet untuk menyinkronkan data.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
